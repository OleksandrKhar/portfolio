<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">

  <title>Frontend Mentor | Social links profile</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      text-align: center;
    }

    .avatar {
      width: 90px;
      height: 90px;
      object-fit: cover;
    }

    body {
      background-color: rgb(23, 23, 23);
      color: white;
    }

    img {
      border-radius: 50%;
    }

    .container {
      background-color: rgb(33, 33, 33);
      width: 25%;
      margin: auto;
      border-radius: 10px;
      padding: 40px;
      text-align: center;
      padding-bottom: 15px;
      margin-top: 100px;
    }

    h2 {
      color: hsl(75, 94%, 57%);
      font-size: 15px;
      margin-bottom: 30px;
    }

    h1 {
      font-size: 160%;
    }

    p {
      margin-bottom: 10px;
    }

    .link {
      display: block;
      background-color: rgb(46, 45, 45);
      color: white;
      text-decoration: none;
      margin: 15px 0;
      padding: 12px;
      border-radius: 8px;
      transition: background-color 0.2s;
    }

    .link:hover {
      background-color: hsl(75, 94%, 57%);
      color: black;
    }
  </style>
</head>

<body>
  <div class="container">
    <img src="assets/images/avatar-jessica.jpeg" alt="Jessica Randall" class="avatar">
    <h1> Jessica Randall </h1>
    <h2> London, United Kingdom </h2>
    <p> "Front-end developer and avid reader." </p>

    <div class="links-wrapper">
      <a class="link" href="https://github.com/OleksandrKhar"> Github </a>
      <a class="link" href="https://www.frontendmentor.io/profile/OleksandrKhar"> Frontend Mentor </a>
      <a class="link" href="#"> LinkedIn </a>
      <a class="link" href="#"> Twitter </a>
      <a class="link" href="#"> Instagram </a>
    </div>
  </div>
</body>

</html>
